x-common: &common
  build: .
  image: zoom-monitor:latest
  restart: unless-stopped
  env_file:
    - .env
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  volumes:
    - zoom_data:/app/data
    - zoom_logs:/app/logs
    - zoom_backup:/app/backup
  networks:
    - zoom-net

services:
  zoom-api:
    <<: *common
    container_name: zoom-api
    environment:
      APP_MODE: api
    ports:
      # 容器内 8000，宿主机绑定 localhost（sub2api 已占 8080，用 8082）
      - "127.0.0.1:8082:8000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  zoom-webhook:
    <<: *common
    container_name: zoom-webhook
    environment:
      APP_MODE: webhook
    ports:
      # webhook 需要公网可达，映射到 9443
      # 配合 Cloudflare Tunnel 或反向代理使用
      - "127.0.0.1:9443:9000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  zoom-monitor:
    <<: *common
    container_name: zoom-monitor
    environment:
      APP_MODE: monitor
      DB_READONLY: "true"
    depends_on:
      zoom-api:
        condition: service_started
    # monitor 无端口暴露，用 PID 1 进程存活做 healthcheck
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 2>/dev/null || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 2
      start_period: 15s

  zoom-command:
    <<: *common
    container_name: zoom-command
    environment:
      APP_MODE: command
      DB_READONLY: "true"
    depends_on:
      zoom-api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 2>/dev/null || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 2
      start_period: 15s

volumes:
  zoom_data:
    driver: local
  zoom_logs:
    driver: local
  zoom_backup:
    driver: local

networks:
  zoom-net:
    driver: bridge
