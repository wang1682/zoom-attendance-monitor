name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t zoom-monitor:latest .
          docker save zoom-monitor:latest | gzip > zoom-monitor.tar.gz

      - name: Generate changelog
        id: changelog
        run: |
          echo "## What\"s Changed" > changelog.md
          echo "" >> changelog.md
          PREV=\$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "\$PREV" ]; then
            git log \$PREV..HEAD --oneline --no-decorate | while read line; do
              echo "- \$line" >> changelog.md
            done
          fi
          echo "" >> changelog.md
          if [ -f RELEASE_NOTES_v0.3.0.md ]; then
            cat RELEASE_NOTES_v0.3.0.md >> changelog.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: \${{ github.ref_name }}
          body_path: changelog.md
          files: zoom-monitor.tar.gz
          make_latest: true
