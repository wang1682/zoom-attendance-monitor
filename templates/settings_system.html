{% extends "base.html" %}
{% block title %}系统设置{% endblock %}
{% block content %}
<div class="page-container">
  <div class="page-header"><h1>🎛️ 系统设置</h1><p>系统状态 v0.8.0</p></div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px">
    <div class="card cp" style="grid-column:1/-1"><h2 style="font-size:14px;font-weight:600;margin-bottom:12px">🏥 健康检查</h2>
      <button class="bt bt-p bt-s" onclick="health()" id="hBtn">刷新</button>
      <div id="hResults" style="margin-top:12px"></div>
    </div>
    <div class="card cp"><h2 style="font-size:14px;font-weight:600;margin-bottom:12px">🐳 容器</h2>
      <table class="data-table"><tbody>{% for n,s in docker_status.items() %}
        <tr><td>{{ n }}</td><td><span class="bg {{ 'bg-g' if s=='running' else 'bg-r' }}">{{ s }}</span></td></tr>{% endfor %}
      </tbody></table>
    </div>
    <div class="card cp"><h2 style="font-size:14px;font-weight:600;margin-bottom:12px">⚡ 快捷</h2>
      <a href="/api/v2/health" target="_blank" class="bt bt-s">API 健康</a>
      <a href="/api/v2/auth/status" target="_blank" class="bt bt-s">OAuth 状态</a>
    </div>
  </div>
</div>
<script>
async function health(){const b=document.getElementById("hBtn");const e=document.getElementById("hResults");b.disabled=true;b.textContent="⏳";
try{const j=await(await fetch("/api/health-check")).json();const items=[{l:"Zoom API",k:"zoom_api"},{l:"Webhook",k:"webhook"},{l:"Telegram",k:"telegram"},{l:"AI",k:"sub2api"},{l:"数据库",k:"database"}];
e.innerHTML=items.map(i=>{const v=j[i.k]||"?";const ok=v==="ok"||v.startsWith("ok");return'<div style="display:flex;justify-content:space-between;padding:6px 10px;border-bottom:1px solid var(--div)"><span style="color:var(--ts)">'+i.l+'</span><span class="bg '+(ok?'bg-g':'bg-r')+'">'+(ok?'✅':'❌')+" "+v+"</span></div>"}).join("")}catch(e){e.innerHTML="失败"}
b.disabled=false;b.textContent="↻ 刷新"}
</script>
{% endblock %}
