{% extends "base.html" %}
{% block title %}管理看板{% endblock %}
{% block content %}
<div class="page-container">
  <div class="page-header" style="margin-bottom:20px">
    <div style="display:flex;align-items:center;justify-content:space-between;width:100%">
      <div><h1>管理看板</h1><p>实时监控 · {{ today }}</p></div>
      <button class="bt bt-s" onclick="location.reload()">↻ 刷新</button>
    </div>
  </div>
  <div class="kpi-grid" id="kpiArea">
    <div class="kpi"><div class="t"><div class="ic" style="background:var(--in-b);color:var(--in)">📊</div><div class="n" id="kpiHealth">—</div></div><div class="l">健康分数</div></div>
    <div class="kpi"><div class="t"><div class="ic" style="background:var(--in-b);color:var(--in)">👥</div><div class="n" id="kpiParticipants">—</div></div><div class="l">参与者</div></div>
    <div class="kpi"><div class="t"><div class="ic" style="background:var(--sc-b);color:var(--sc)">🟢</div><div class="n" id="kpiOnline">—</div></div><div class="l">在线</div></div>
    <div class="kpi"><div class="t"><div class="ic" style="background:var(--da-b);color:var(--da)">🚨</div><div class="n" id="kpiAnomalies">—</div></div><div class="l">异常</div></div>
    <div class="kpi"><div class="t"><div class="ic" style="background:var(--wa-b);color:var(--wa)">🔔</div><div class="n" id="kpiAlerts">0</div></div><div class="l">告警</div></div>
    <div class="kpi"><div class="t"><div class="ic" style="background:var(--in-b);color:var(--in)">📋</div><div class="n" id="kpiEvents">—</div></div><div class="l">事件</div></div>
  </div>
  <div class="three-col">
    <div class="card cp"><h2 style="font-size:14px;font-weight:600;margin:0 0 12px 0">🚨 异常成员</h2><span id="anomalyTotal" style="font-size:11px;color:var(--tm);background:var(--tb);padding:2px 10px;border-radius:10px;float:right;margin-top:-32px">—</span><div id="anomalyList" style="font-size:12px;color:var(--tm);text-align:center;padding:20px">加载中...</div></div>
    <div class="card cp"><h2 style="font-size:14px;font-weight:600;margin:0 0 12px 0">🤖 AI 总结</h2><div id="aiBlock" style="font-size:12px;color:var(--tm);text-align:center;padding:20px">加载中...</div></div>
    <div class="card cp"><h2 style="font-size:14px;font-weight:600;margin:0 0 12px 0">🟢 当前在线</h2><span id="onlineCount" style="font-size:11px;color:var(--tm);background:var(--tb);padding:2px 10px;border-radius:10px;float:right;margin-top:-32px">—</span><div id="onlineList" style="font-size:12px;color:var(--tm);text-align:center;padding:20px">暂无</div></div>
  </div>
  <div class="card" style="margin-top:20px">
    <div class="sh"><h2>👥 参与者概览</h2><span class="c" id="summaryCount">—</span></div>
    <table class="data-table"><thead><tr><th>#</th><th>成员</th><th>事件</th><th>时长</th><th>风险</th><th>状态</th><th>最后</th></tr></thead><tbody id="summaryBody"></tbody></table>
  </div>
  <div class="card" style="margin-top:16px">
    <div class="sh"><h2>📋 近期事件</h2><span class="c" id="eventCount">—</span></div>
    <table class="data-table"><thead><tr><th>#</th><th>成员</th><th>状态</th><th>时间</th></tr></thead><tbody id="eventBody"></tbody></table>
  </div>
</div>
<style>
.three-col{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:16px;margin-bottom:0}
@media(max-width:900px){.three-col{grid-template-columns:1fr}}
</style>
<script>
async function loadDash(){try{
const r=await fetch("/api/v2/live");const d=await r.json();if(!d.ok)return;
const ac=d.anomalies?.length||0;const hs=Math.max(0,100-ac*10);
document.getElementById("kpiHealth").textContent=hs+"/100";
document.getElementById("kpiParticipants").textContent=d.unique_participants;
document.getElementById("kpiOnline").textContent=d.total_online;
document.getElementById("kpiAnomalies").textContent=ac;
document.getElementById("kpiEvents").textContent=d.total_events;
document.getElementById("anomalyTotal").textContent=ac+"人";
const al=document.getElementById("anomalyList");
if(ac){al.innerHTML=d.anomalies.slice(0,3).map((a,i)=>'<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--div)"><span style="width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;background:'+(i===0?'var(--da-b);color:var(--da)':i===1?'var(--wa-b);color:var(--wa)':'var(--in-b);color:var(--in)')+'">'+(i+1)+'</span><div style="flex:1"><div style="font-size:13px;font-weight:600">'+a.name+'</div><div style="font-size:11px;color:var(--ts)">'+a.flags.join("、")+'</div></div><div style="font-size:14px;font-weight:600;color:var(--ts)">'+a.actions+'次</div></div>').join("")}else{al.innerHTML='<div style="text-align:center;padding:20px;color:var(--tm)">✅ 今日无异常</div>'}
const ai=document.getElementById("aiBlock");
const ps=(d.ai_summary||"").split("。").filter(Boolean);ai.innerHTML=ps.map(s=>'<div style="padding:3px 0;font-size:13px;line-height:1.6">'+s+"。</div>").join("")+'<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--div)"><span style="font-size:11px;color:var(--tm)">💡 建议：检查异常成员网络状态</span></div>';
document.getElementById("onlineCount").textContent=d.total_online+"人";
const ol=document.getElementById("onlineList");
if(d.online.length){ol.innerHTML=d.online.map(p=>'<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--div)"><span class="dt dt-on"></span><span style="flex:1;font-size:13px;font-weight:500">'+p.name+'</span><span style="font-size:12px;color:var(--ts)">'+(p.online_display||p.online_minutes+"分钟")+'</span></div>').join("")}else{ol.innerHTML='<div style="text-align:center;padding:20px;color:var(--tm)">暂无在线</div>'}
const sd=d.participants_summary||[];
document.getElementById("summaryCount").textContent=sd.length+"人";
const sb=document.getElementById("summaryBody");
if(sd.length){sb.innerHTML=sd.slice(0,8).map((p,i)=>'<tr><td class="i">'+(i+1)+'</td><td class="nm">'+p.name+'</td><td>'+(p.total_actions||(p.enters+p.leaves))+'</td><td>'+p.duration_display+'</td><td>'+(p.flags?.length?p.flags.map(f=>'<span class="tg tg-d">'+f+'</span>').join(""):'<span style="color:var(--tm)">—</span>')+'</td><td><span class="dt '+(p.is_online?"dt-on":"dt-off")+'"></span></td><td class="mono">'+((p.last_active||"").slice(11,19))+'</td></tr>').join("")}else{sb.innerHTML='<tr><td colspan="7" style="text-align:center;padding:32px;color:var(--tm)">暂无</td></tr>'}
const evt=sd.filter(p=>p.last_active).sort((a,b)=>(b.last_active||"").localeCompare(a.last_active||"")).slice(0,10);
document.getElementById("eventCount").textContent=(d.total_events||0)+"条";
const eb=document.getElementById("eventBody");
if(evt.length){eb.innerHTML=evt.map((p,i)=>'<tr><td class="i">'+(i+1)+'</td><td class="nm">'+p.name+'</td><td><span class="dt '+(p.is_online?"dt-on":"dt-off")+'"></span></td><td class="mono">'+((p.last_active||"").slice(11,19))+'</td></tr>').join("")}else{eb.innerHTML='<tr><td colspan="4" style="text-align:center;padding:32px;color:var(--tm)">暂无</td></tr>'}
}catch(e){}}
loadDash();setInterval(loadDash,15000);
</script>
{% endblock %}
