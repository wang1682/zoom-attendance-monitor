{% extends "base.html" %}
{% block title %}Zoom Monitor{% endblock %}
{% block head %}
<script>
function formatMYT(ts){
  if(!ts) return "";
  try{
    var d = new Date(ts);
    if(isNaN(d)) return ts;
    var pad = function(n){ return String(n).padStart(2,"0"); };
    return pad(d.getHours()) + ":" + pad(d.getMinutes());
  }catch(e){return ts;}
}

async function refreshDashboard(){
  try{
    var r = await fetch("/api/v3/dashboard?_=" + Date.now(), {cache:"no-store"});
    var j = await r.json();
    if(!j.ok) return;

    document.getElementById("kpiParticipants").textContent = j.participant_count;
    document.getElementById("kpiOnline").textContent = j.online_count;
    document.getElementById("kpiJoin").textContent = j.join_count;
    document.getElementById("kpiLeave").textContent = j.leave_count;

    var badgeP = document.getElementById("badgeParticipants");
    if(badgeP) badgeP.textContent = j.participants.length + "人";
    var pb = document.getElementById("participantsBody");
    if(pb){
      pb.innerHTML = j.participants.length ? j.participants.map(function(p){
        var status = p.status === "在线中" ? "🟢 在线中" : "⚫ 已离线";
        return "<tr><td class=\"nm\">" + (p.name || "-") + "</td><td>" + status + "</td><td>" + (p.current_session || p.session_duration || "—") + "</td><td>" + (p.total_duration || p.today_duration || "—") + "</td><td>" + (p.leave_count || 0) + "</td><td class=\"mono\">" + formatMYT(p.last_active) + "</td></tr>";
      }).join("") : "<tr><td colspan=\"6\" style=\"text-align:center;padding:32px;color:var(--tm)\">暂无数据</td></tr>";
    }

    // Sharing badge from API
    var badgeS = document.getElementById("badgeSharing");
    if(badgeS) badgeS.textContent = j.sharing_count + "人";

    // Sharing banner
    try{
      var srb = await fetch("/api/v3/sharing-live?_=" + Date.now(), {cache:"no-store"});
      var sdb = await srb.json();
      var ban = document.getElementById("sharingBanner");
      if(ban){
        if(sdb.ok && sdb.current > 0 && sdb.active && sdb.active.length){
          var names = sdb.active.map(function(s){ return s.name || s.raw_name || "-"; }).join("、");
          ban.innerHTML = "<div style=\"background:color-mix(in srgb,var(--da) 12%,transparent);border:1px solid color-mix(in srgb,var(--da) 30%,transparent);border-radius:10px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px\">"
            + "<span style=\"font-size:18px\">🖥️</span>"
            + "<div style=\"flex:1\"><div style=\"font-size:14px;font-weight:600;color:var(--da)\">正在共享屏幕</div>"
            + "<div style=\"font-size:12px;color:var(--ts);margin-top:2px\">" + names + "</div></div>"
            + "<span style=\"font-size:11px;color:var(--ts);background:var(--div);padding:2px 10px;border-radius:10px\">" + sdb.current + "人</span></div>";
          ban.style.display = "block";
        } else {
          ban.style.display = "none";
        }
      }
    }catch(e){}

    // Sharing card content
    var sc = document.getElementById("sharingContent");
    if(sc){
      try{
        var scData = await fetch("/api/v3/sharing-live?_=" + Date.now(), {cache:"no-store"});
        var scJson = await scData.json();
        if(scJson.ok && scJson.current > 0 && scJson.active && scJson.active.length){
          sc.innerHTML = scJson.active.map(function(s){
            return "<div style=\"display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--div)\">"
              + "<span style=\"width:8px;height:8px;border-radius:50%;background:var(--in);flex-shrink:0\"></span>"
              + "<span style=\"flex:1;font-size:13px;font-weight:500\">"+(s.name||s.raw_name||"-")+"</span>"
              + "<span style=\"font-size:12px;color:var(--ts)\">"+(s.duration_display||"")+"</span></div>";
          }).join("");
        } else if(scJson.ok && scJson.recent && scJson.recent.length){
          var recentList = scJson.recent.slice(0,5);
          sc.innerHTML = "<div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:8px\">"
            + "<span style=\"font-size:11px;color:var(--ts)\">最近共享：</span>"
            + "<span style=\"font-size:11px;color:var(--wa)\">zoom API状态不稳定</span></div>"
            + recentList.map(function(s){
              var ic = s.content === "application" ? "📱" : (s.content === "desktop" ? "🖥️" : "📄");
              return "<div style=\"display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--div)\">"
                + "<span style=\"width:6px;height:6px;border-radius:50%;background:var(--ts);flex-shrink:0\"></span>"
                + "<span style=\"flex:1;font-size:12px\">" + ic + " " + (s.name||s.raw_name||"-") + "</span>"
                + "<span style=\"font-size:12px;color:var(--ts)\">" + (s.start_time_display||"") + "</span></div>";
            }).join("")
            + "<div style=\"font-size:11px;color:var(--wa);margin-top:8px;padding:6px 8px;background:color-mix(in srgb,var(--wa) 10%,transparent);border-radius:6px\">Zoom对分组房间共享状态不稳定，实时共享可能无法持续检测</div>";
        } else {
          sc.innerHTML = "<div style=\"text-align:center;padding:20px;color:var(--tm)\">当前无人共享</div>";
        }
      }catch(e){
        sc.innerHTML = "<div style=\"text-align:center;padding:20px;color:var(--tm)\">当前无人共享</div>";
      }
    }
  }catch(e){
    console.error("refreshDashboard error:", e);
  }
}
window.addEventListener("load", refreshDashboard);
setInterval(refreshDashboard, 15000);
</script>
{% endblock %}
{% block content %}
<div id="sharingBanner" style="display:none"></div>
<div class="page-container">
  <div class="page-header">
    <h1 class="page-title">📊 今日概况</h1>
    <p class="page-subtitle">实时监控 · {{ today }}</p>
  </div>
  <div class="kpi-grid three">
    <div class="kpi-card">
      <div class="kpi-label">参与者</div>
      <div class="kpi-value" id="kpiParticipants">—</div>
      <div class="kpi-sub">今日活跃成员</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">在线</div>
      <div class="kpi-value" id="kpiOnline" style="color:var(--sc)">—</div>
      <div class="kpi-sub">当前会议中</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">加入</div>
      <div class="kpi-value" id="kpiJoin" style="color:var(--in)">—</div>
      <div class="kpi-sub">今日加入次数</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">离开</div>
      <div class="kpi-value" id="kpiLeave" style="color:var(--wa)">—</div>
      <div class="kpi-sub">今日离开次数</div>
    </div>
  </div>
  <div class="grid-2">
    <section class="card">
      <div class="card-header">
        <h2 class="card-title">🖥 当前共享</h2>
        <span class="card-badge" id="badgeSharing">—</span>
      </div>
      <div id="sharingContent" style="font-size:12px;color:var(--tm);text-align:center;padding:20px">加载中...</div>
    </section>
  </div>
  <section class="card" style="margin-top:0">
    <div class="card-header">
      <h2 class="card-title">👥 参与者</h2>
      <span class="card-badge" id="badgeParticipants">—</span>
    </div>
    <table class="data-table">
      <thead>
        <tr>
          <th>成员</th>
          <th>状态</th>
          <th>本次在线</th>
          <th>今日累计</th>
          <th>离开次数</th>
          <th>最后活动</th>
        </tr>
      </thead>
      <tbody id="participantsBody"></tbody>
    </table>
  </section>
</div>
{% endblock %}
