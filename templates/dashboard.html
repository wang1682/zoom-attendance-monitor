{% extends "base.html" %}
{% block title %}管理看板{% endblock %}
{% block content %}
<div class="ph"><h1>管理看板</h1><p>实时监控 · {{ today }}</p></div>
<div class="kg">
  <div class="kc"><div class="kr"><div class="ki" style="background:var(--in-b);color:var(--in)">📊</div><div class="kv" id="k1">—</div></div><div class="kl">健康分数</div></div>
  <div class="kc"><div class="kr"><div class="ki" style="background:var(--in-b);color:var(--in)">👥</div><div class="kv" id="k2">—</div></div><div class="kl">参与者</div></div>
  <div class="kc"><div class="kr"><div class="ki" style="background:var(--sc-b);color:var(--sc)">🟢</div><div class="kv" id="k3">—</div></div><div class="kl">在线</div></div>
  <div class="kc"><div class="kr"><div class="ki" style="background:var(--da-b);color:var(--da)">🚨</div><div class="kv" id="k4">—</div></div><div class="kl">异常</div></div>
  <div class="kc"><div class="kr"><div class="ki" style="background:var(--wa-b);color:var(--wa)">🔔</div><div class="kv" id="k5">0</div></div><div class="kl">告警</div></div>
  <div class="kc"><div class="kr"><div class="ki" style="background:var(--in-b);color:var(--in)">📋</div><div class="kv" id="k6">—</div></div><div class="kl">事件</div></div>
</div>
<div class="ig">
  <div class="card cp"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h2 style="font-size:14px;font-weight:600;margin:0">🚨 异常成员</h2><span style="font-size:11px;color:var(--tm);background:var(--div);padding:2px 10px;border-radius:10px" id="at">—</span></div><div id="al" style="font-size:12px;color:var(--tm);text-align:center;padding:20px">加载中...</div></div>
  <div class="card cp"><h2 style="font-size:14px;font-weight:600;margin:0 0 12px 0">🤖 AI 总结</h2><div id="aib" style="font-size:12px;color:var(--tm);text-align:center;padding:20px">加载中...</div></div>
  <div class="card cp"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h2 style="font-size:14px;font-weight:600;margin:0">🟢 当前在线</h2><span style="font-size:11px;color:var(--tm);background:var(--div);padding:2px 10px;border-radius:10px" id="oc">—</span></div><div id="ol" style="font-size:12px;color:var(--tm);text-align:center;padding:20px">暂无</div></div>
</div>
<div class="card" style="margin-bottom:16px"><div class="sh"><h2>👥 参与者概览</h2><span class="c" id="sc">—</span></div><table class="dt"><thead><tr><th>#</th><th>成员</th><th>事件</th><th>时长</th><th>风险</th><th>状态</th><th>最后</th></tr></thead><tbody id="sb"></tbody></table></div>
<div class="card"><div class="sh"><h2>📋 近期事件</h2><span class="c" id="ec">—</span></div><table class="dt"><thead><tr><th>#</th><th>成员</th><th>状态</th><th>时间</th></tr></thead><tbody id="eb"></tbody></table></div>
<script>
async function ld(){try{
const r=await fetch("/api/v2/live");const d=await r.json();if(!d.ok)return;
const ac=d.anomalies?.length||0;const hs=Math.max(0,100-ac*10);
document.getElementById("k1").textContent=hs+"/100";document.getElementById("k2").textContent=d.unique_participants;
document.getElementById("k3").textContent=d.total_online;document.getElementById("k4").textContent=ac;
document.getElementById("k6").textContent=d.total_events;document.getElementById("at").textContent=ac+"人";
const al=document.getElementById("al");
if(ac){al.innerHTML=d.anomalies.slice(0,3).map((a,i)=>'<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--div)"><span style="width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;background:'+(i===0?'var(--da-b);color:var(--da)':i===1?'var(--wa-b);color:var(--wa)':'var(--in-b);color:var(--in)')+'">'+(i+1)+'</span><div style="flex:1"><div style="font-size:13px;font-weight:600">'+a.name+'</div><div style="font-size:11px;color:var(--ts)">'+a.flags.join("、")+'</div></div><div style="font-size:14px;font-weight:600;color:var(--ts)">'+a.actions+'次</div></div>').join("")}else{al.innerHTML='<div style="text-align:center;padding:24px;color:var(--tm)">✅ 今日无异常</div>'}
const ai=document.getElementById("aib");
const ps=(d.ai_summary||"").split("。").filter(Boolean);ai.innerHTML=ps.map(s=>'<div style="padding:4px 0;font-size:13px;line-height:1.6">'+s+"。</div>").join("")+'<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--div)"><span style="font-size:11px;color:var(--tm)">💡 检查异常成员网络状态</span></div>';
document.getElementById("oc").textContent=d.total_online+"人";
const ol=document.getElementById("ol");
if(d.online.length){ol.innerHTML=d.online.map(p=>'<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--div)"><span style="width:8px;height:8px;border-radius:50%;background:var(--sc);flex-shrink:0"></span><span style="flex:1;font-size:13px;font-weight:500">'+p.name+'</span><span style="font-size:12px;color:var(--ts)">'+(p.online_display||p.online_minutes+"分钟")+'</span></div>').join("")}else{ol.innerHTML='<div style="text-align:center;padding:20px;color:var(--tm)">暂无在线</div>'}
const sd=d.participants_summary||[];
document.getElementById("sc").textContent=sd.length+"人";
const sb=document.getElementById("sb");
if(sd.length){sb.innerHTML=sd.slice(0,8).map((p,i)=>'<tr><td class="i">'+(i+1)+'</td><td class="nm">'+p.name+'</td><td>'+(p.total_actions||(p.enters+p.leaves))+'</td><td>'+p.duration_display+'</td><td>'+(p.flags?.length?p.flags.map(f=>'<span class="tg tg-d">'+f+'</span>').join(""):'<span style="color:var(--tm)">—</span>')+'</td><td><span style="width:8px;height:8px;border-radius:50%;display:inline-block;background:'+(p.is_online?"var(--sc)":"var(--tm)")+'"></span></td><td class="mono">'+((p.last_active||"").slice(11,19))+'</td></tr>').join("")}else{sb.innerHTML='<tr><td colspan="7" style="text-align:center;padding:32px;color:var(--tm)">暂无</td></tr>'}
const ev=sd.filter(p=>p.last_active).sort((a,b)=>(b.last_active||"").localeCompare(a.last_active||"")).slice(0,10);
document.getElementById("ec").textContent=(d.total_events||0)+"条";
const eb=document.getElementById("eb");
if(ev.length){eb.innerHTML=ev.map((p,i)=>'<tr><td class="i">'+(i+1)+'</td><td class="nm">'+p.name+'</td><td><span style="width:8px;height:8px;border-radius:50%;display:inline-block;background:'+(p.is_online?"var(--sc)":"var(--tm)")+'"></span></td><td class="mono">'+((p.last_active||"").slice(11,19))+'</td></tr>').join("")}else{eb.innerHTML='<tr><td colspan="4" style="text-align:center;padding:32px;color:var(--tm)">暂无</td></tr>'}
}catch(e){}}
ld();setInterval(ld,15000);
</script>
{% endblock %}
