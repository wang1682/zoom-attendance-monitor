{% extends "base.html" %}
{% block title %}出勤统计{% endblock %}
{% block content %}
<div class="page-container">
<div class="page-header"><h1 class="page-title">&#128197; 出勤统计</h1><p class="page-subtitle">周/月维度出勤报表</p>
<div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-primary btn-sm" onclick="loadAtt('week')" id="bw">本周</button><button class="btn btn-sm" onclick="loadAtt('month')" id="bm">本月</button></div></div>
<div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:20px">
<div class="kpi-card"><div class="kpi-top"><span class="kpi-value" id="aTotal">&#8212;</span></div><div class="kpi-label">总人数</div></div>
<div class="kpi-card"><div class="kpi-top"><span class="kpi-value" id="aMin">&#8212;</span></div><div class="kpi-label">总时长</div></div>
<div class="kpi-card"><div class="kpi-top"><span class="kpi-value" style="font-size:20px" id="aPeriod">本周</span></div><div class="kpi-label">周期</div></div>
</div>
<div class="card"><table class="data-table"><thead><tr><th>#</th><th>姓名</th><th>天数</th><th>次数</th><th>总时长</th><th>平均</th></tr></thead><tbody id="attTable"></tbody></table></div>
</div>
<script>
async function loadAtt(p){document.getElementById("bw").className="btn btn-sm"+(p==='week'?' btn-primary':'');document.getElementById("bm").className="btn btn-sm"+(p==='month'?' btn-primary':'');document.getElementById("aPeriod").textContent=p==='week'?'&#26412;&#21608;':'&#26412;&#26376;';
const r=await fetch("/api/v2/attendance?period="+p);const d=await r.json();if(!d.ok)return;
document.getElementById("aTotal").textContent=d.total_people;document.getElementById("aMin").textContent=d.total_minutes+"&#20998;&#38047;";
const t=document.getElementById("attTable");if(d.members.length){t.innerHTML=d.members.map((m,i)=>'<tr><td class="td-num">'+(i+1)+'</td><td class="td-name">'+m.name+'</td><td>'+m.total_days+'&#22825;</td><td>'+m.total_entries+'&#27425;</td><td>'+m.total_duration_min+'&#20998;&#38047;</td><td>'+m.avg_duration_min+'&#20998;&#38047;</td></tr>').join("")}else{t.innerHTML='<tr><td colspan="6" class="td-empty">&#26242;&#26080;</td></tr>'}}
loadAtt('week');
</script>
{% endblock %}
