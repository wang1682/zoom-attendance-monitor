{% extends "base.html" %}
{% block title %}出勤统计{% endblock %}
{% block content %}
<div class="page-container">
<div class="page-header"><h1 class="page-title">出勤统计</h1><p class="page-subtitle">周/月维度出勤报表</p>
<div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-primary btn-sm" onclick="loadAtt('week')" id="bw">本周</button><button class="btn btn-sm" onclick="loadAtt('month')" id="bm">本月</button></div></div>

<div class="metric-grid mg-3">
  <div class="metric-card">
    <div class="mc-icon" style="background:var(--in-b);color:var(--in)">👥</div>
    <div class="mc-value" id="aTotal">—</div>
    <div class="mc-label">总人数</div>
    <div class="mc-sub">当前周期</div>
  </div>
  <div class="metric-card">
    <div class="mc-icon" style="background:var(--pr);color:#fff">⏱</div>
    <div class="mc-value" id="aMin">—</div>
    <div class="mc-label">总时长</div>
    <div class="mc-sub">累计在线时长</div>
  </div>
  <div class="metric-card">
    <div class="mc-icon" style="background:var(--sc-b);color:var(--sc)">📅</div>
    <div class="mc-value" style="font-size:22px" id="aPeriod">本周</div>
    <div class="mc-label">周期</div>
    <div class="mc-sub">当前报表区间</div>
  </div>
</div>

<div class="top-three" id="topThreeArea">
  <div class="top-card" id="top1">
    <div class="tc-rank">🥇</div>
    <div class="tc-name" id="t1Name">—</div>
    <div class="tc-stat" id="t1Stat">—</div>
    <div class="tc-sub">第一名</div>
  </div>
  <div class="top-card" id="top2">
    <div class="tc-rank">🥈</div>
    <div class="tc-name" id="t2Name">—</div>
    <div class="tc-stat" id="t2Stat">—</div>
    <div class="tc-sub">第二名</div>
  </div>
  <div class="top-card" id="top3">
    <div class="tc-rank">🥉</div>
    <div class="tc-name" id="t3Name">—</div>
    <div class="tc-stat" id="t3Stat">—</div>
    <div class="tc-sub">第三名</div>
  </div>
</div>

<div class="card" id="attCard">
  <div class="card-header"><h2>出勤排行</h2></div>
  <table class="data-table"><thead><tr><th>#</th><th>姓名</th><th>天数</th><th>次数</th><th>总时长</th><th>平均</th></tr></thead><tbody id="attTable"><tr><td colspan="6" class="td-empty">加载中...</td></tr></tbody></table>
</div>
</div>

<script>
async function loadAtt(p){
  document.getElementById("bw").className="btn btn-sm"+(p==='week'?' btn-primary':'');
  document.getElementById("bm").className="btn btn-sm"+(p==='month'?' btn-primary':'');
  document.getElementById("aPeriod").textContent=p==='week'?'本周':'本月';
  const r=await fetch("/api/v2/attendance?period="+p);
  const d=await r.json();
  if(!d.ok)return;
  document.getElementById("aTotal").textContent=d.total_people;
  document.getElementById("aMin").textContent=d.total_minutes+"分钟";

  const ms=d.members||[];
  // Top 3
  const top3=ms.slice(0,3);
  const names=["t1Name","t2Name","t3Name"];
  const stats=["t1Stat","t2Stat","t3Stat"];
  const tops=["top1","top2","top3"];
  for(let i=0;i<3;i++){
    if(top3[i]){
      document.getElementById(names[i]).textContent=top3[i].name;
      document.getElementById(stats[i]).textContent=top3[i].total_duration_min+"分钟";
      document.getElementById(tops[i]).style.display="block";
    } else {
      document.getElementById(names[i]).textContent="—";
      document.getElementById(stats[i]).textContent="—";
    }
  }

  // Table
  const t=document.getElementById("attTable");
  if(ms.length){
    t.innerHTML=ms.map((m,i)=>`<tr><td class="td-num">${i+1}</td><td class="td-name">${m.name}</td><td>${m.total_days}天</td><td>${m.total_entries}次</td><td>${m.total_duration_min}分钟</td><td>${m.avg_duration_min}分钟</td></tr>`).join("");
  } else {
    t.innerHTML='<tr><td colspan="6"><div class="empty-state"><div class="es-icon">📭</div><div class="es-title">暂无数据</div><div class="es-desc">今天还没有出勤记录</div></div></td></tr>';
  }
}
loadAtt('week');
</script>
{% endblock %}
