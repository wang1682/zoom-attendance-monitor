{% extends "base.html" %}
{% block title %}出勤统计{% endblock %}
{% block head %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
.chart-wrap{background:var(--card);border:1px solid var(--cb);border-radius:12px;padding:18px;margin-bottom:16px}
.chart-wrap h3{font-size:14px;font-weight:600;margin:0 0 12px;color:var(--text)}
</style>
{% endblock %}
{% block content %}
<div class="page-container">
<div class="page-header"><h1 class="page-title">出勤统计</h1><p class="page-subtitle">周/月维度出勤报表</p>
<div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-primary btn-sm" onclick="loadAtt('week')" id="bw">本周</button><button class="btn btn-sm" onclick="loadAtt('month')" id="bm">本月</button></div></div>

<div class="metric-grid mg-3">
  <div class="metric-card">
    <div class="mc-icon" style="background:var(--in-b);color:var(--in)">👥</div>
    <div class="mc-value" id="aTotal">—</div>
    <div class="mc-label">总人数</div>
    <div class="mc-sub">当前周期</div>
  </div>
  <div class="metric-card">
    <div class="mc-icon" style="background:var(--pr);color:#fff">⏱</div>
    <div class="mc-value" id="aMin">—</div>
    <div class="mc-label">总时长</div>
    <div class="mc-sub">累计在线时长</div>
  </div>
  <div class="metric-card">
    <div class="mc-icon" style="background:var(--sc-b);color:var(--sc)">📅</div>
    <div class="mc-value" style="font-size:22px" id="aPeriod">本周</div>
    <div class="mc-label">周期</div>
    <div class="mc-sub">当前报表区间</div>
  </div>
</div>

<div class="top-three" id="topThreeArea">
  <div class="top-card" id="top1">
    <div class="tc-rank">🥇</div>
    <div class="tc-name" id="t1Name">—</div>
    <div class="tc-stat" id="t1Stat">—</div>
    <div class="tc-sub">第一名</div>
  </div>
  <div class="top-card" id="top2">
    <div class="tc-rank">🥈</div>
    <div class="tc-name" id="t2Name">—</div>
    <div class="tc-stat" id="t2Stat">—</div>
    <div class="tc-sub">第二名</div>
  </div>
  <div class="top-card" id="top3">
    <div class="tc-rank">🥉</div>
    <div class="tc-name" id="t3Name">—</div>
    <div class="tc-stat" id="t3Stat">—</div>
    <div class="tc-sub">第三名</div>
  </div>
</div>

<div class="chart-wrap" style="height:220px;position:relative">
  <h3>📊 出勤趋势</h3>
  <canvas id="attChart" style="width:100%;height:180px"></canvas>
</div>

<div class="card" id="attCard">
  <div class="card-header"><h2>出勤排行</h2></div>
  <table class="data-table"><thead><tr><th>#</th><th>姓名</th><th>天数</th><th>次数</th><th>总时长</th><th>平均</th></tr></thead><tbody id="attTable"><tr><td colspan="6" class="td-empty">加载中...</td></tr></tbody></table>
</div>
</div>

<script>
let attChart=null;
async function loadAtt(p){
  document.getElementById("bw").className="btn btn-sm"+(p==='week'?' btn-primary':'');
  document.getElementById("bm").className="btn btn-sm"+(p==='month'?' btn-primary':'');
  document.getElementById("aPeriod").textContent=p==='week'?'本周':'本月';
  const r=await fetch("/api/v2/attendance?period="+p);
  const d=await r.json();
  if(!d.ok)return;
  document.getElementById("aTotal").textContent=d.total_people;
  document.getElementById("aMin").textContent=d.total_minutes+"分钟";

  const ms=d.members||[];
  // Top 3
  const top3=ms.slice(0,3);
  for(let i=0;i<3;i++){
    document.getElementById("t"+(i+1)+"Name").textContent=top3[i]?top3[i].name:"—";
    document.getElementById("t"+(i+1)+"Stat").textContent=top3[i]?top3[i].total_duration_min+"分钟":"—";
  }

  // Table
  const t=document.getElementById("attTable");
  if(ms.length){
    t.innerHTML=ms.map((m,i)=>`<tr><td class="td-num">${i+1}</td><td class="td-name">${m.name}</td><td>${m.total_days}天</td><td>${m.total_entries}次</td><td>${m.total_duration_min}分钟</td><td>${m.avg_duration_min}分钟</td></tr>`).join("");
  } else {
    t.innerHTML='<tr><td colspan="6"><div class="empty-state"><div class="es-icon">📭</div><div class="es-title">暂无数据</div><div class="es-desc">今天还没有出勤记录</div></div></td></tr>';
  }

  // Chart — duration per member (top 8, skip negative)
  const top8=ms.slice(0,8).filter(m=>m.total_duration_min>=0);
  if(attChart) { attChart.destroy(); attChart=null; }
  const isDark=document.documentElement.getAttribute('data-theme')==='dark';
  const textColor=isDark?'#94a3b8':'#64748b';
  const gridColor=isDark?'#1a2540':'#f1f5f9';
  // Replace canvas and create chart on next tick
  const oldCanvas=document.getElementById('attChart');
  if(oldCanvas){
    const wrap=oldCanvas.parentElement;
    const newCanvas=document.createElement('canvas');
    newCanvas.id='attChart';
    newCanvas.style.cssText='width:100%;height:180px;display:block';
    oldCanvas.replaceWith(newCanvas);
    setTimeout(function(){
      try {
        attChart=new Chart(newCanvas,{
    type:'bar',
    data:{
      labels:top8.map(m=>m.name),
      datasets:[{
        label:'总时长（分钟）',
        data:top8.map(m=>m.total_duration_min),
        backgroundColor:top8.map((_,i)=>['rgba(99,102,241,.8)','rgba(59,130,246,.8)','rgba(34,197,94,.8)','rgba(251,146,60,.8)','rgba(236,72,153,.8)','rgba(168,85,247,.8)','rgba(20,184,166,.8)','rgba(148,163,184,.8)'][i]),
        borderRadius:4
      }]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        x:{ticks:{color:textColor,font:{size:10}},grid:{display:false}},
        y:{ticks:{color:textColor,font:{size:10}},grid:{color:gridColor},beginAtZero:true}
      }
    });
      } catch(e){ console.error('Chart error:', e); }
    }, 50);
  }
}
// Render immediately, Chart.js will be loaded from head
loadAtt('week');
// Watch theme toggle
const _origTheme=document.querySelector('#tB')?.onclick;
const _obs=new MutationObserver(()=>{
  if(attChart){
    const isDark=document.documentElement.getAttribute('data-theme')==='dark';
    attChart.options.scales.x.ticks.color=isDark?'#94a3b8':'#64748b';
    attChart.options.scales.y.ticks.color=isDark?'#94a3b8':'#64748b';
    attChart.options.scales.y.grid.color=isDark?'#1a2540':'#f1f5f9';
    attChart.update();
  }
});
_obs.observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
</script>
{% endblock %}
