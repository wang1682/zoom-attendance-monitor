{% extends "base.html" %}
{% block title %}事件记录{% endblock %}
{% block content %}
<div class="page-container">
  <div class="page-header"><h1>📅 事件记录</h1><p>系统事件流水</p></div>
  <div class="card"><table class="data-table"><thead><tr><th>类型</th><th>时间</th></tr></thead><tbody>
    {% for e in events %}<tr><td class="nm">{{ e.event_type }}</td><td class="mono">{{ to_myt(e.created_at) }}</td></tr>
    {% else %}<tr><td colspan="2" style="text-align:center;padding:32px;color:var(--tm)">暂无</td></tr>{% endfor %}
  </tbody></table></div>
</div>
{% endblock %}
