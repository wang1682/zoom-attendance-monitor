<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>参会 - Zoom 监控</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f172a;color:#e2e8f0}nav{background:#1e293b;padding:12px 24px;display:flex;gap:16px;align-items:center;border-bottom:1px solid #334155}nav a{color:#94a3b8;text-decoration:none;font-size:14px;padding:6px 12px;border-radius:6px}nav a:hover{background:#334155;color:#e2e8f0}nav .title{font-size:16px;font-weight:600;color:#f1f5f9;margin-right:auto}.container{max-width:1200px;margin:0 auto;padding:24px}.table-wrap{background:#1e293b;border-radius:8px;border:1px solid #334155;overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;padding:10px 12px;background:#0f172a;color:#94a3b8;font-weight:500}td{padding:8px 12px;border-top:1px solid #1e293b}tr:hover{background:#334155}.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}.badge-enter{background:#065f46;color:#6ee7b7}.badge-leave{background:#7c2d12;color:#fdba74}.time{color:#94a3b8;font-family:monospace;font-size:12px}
</style>
</head>
<body>
<nav>
  <span class="title">👁️ Zoom 监控</span>
  <a href="/">仪表盘</a>
  <a href="/events">事件</a>
  <a href="/participants" style="background:#334155;color:#e2e8f0">参会</a>
  <a href="/alerts">告警</a>
</nav>
<div class="container">
  <h2 style="margin-bottom:12px;font-size:16px">👤 参会记录 (今日)</h2>
  <div class="table-wrap">
    <table>
      <thead><tr><th>姓名</th><th>邮箱</th><th>动作</th><th>时间</th><th>来源</th></tr></thead>
      <tbody>
        {% for p in participants %}
        <tr>
          <td>{{ p.name }}</td><td style="color:#94a3b8">{{ p.email }}</td>
          <td><span class="badge badge-{{ p.action }}">{{ '进入' if p.action == 'enter' else '离开' }}</span></td>
          <td class="time">{{ p.action_time[:19] }}</td>
          <td style="color:#94a3b8">{{ p.source }}</td>
        </tr>
        {% endfor %}
        {% if not participants %}
        <tr><td colspan="5" style="text-align:center;color:#64748b;padding:40px">暂无记录</td></tr>
        {% endif %}
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
