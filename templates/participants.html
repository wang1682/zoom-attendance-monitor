{% extends "base.html" %}
{% block title %}参会明细{% endblock %}
{% block content %}
<div class="page-container">
  <div class="page-header"><h1>📋 参会明细</h1><p>今日所有参会记录</p></div>
  <div class="card">
    <table class="data-table">
      <thead><tr><th>姓名</th><th>动作</th><th>时间</th><th>来源</th></tr></thead>
      <tbody>{% for p in participants %}
        <tr><td class="nm">{{ p.name }}</td><td>{% if p.action == 'enter' %}<span class="bg bg-g">进入</span>{% else %}<span class="bg bg-r">离开</span>{% endif %}</td><td class="mono">{{ to_myt(p.action_time) }}</td><td>{{ p.source }}</td></tr>
        {% else %}<tr><td colspan="4" style="text-align:center;padding:32px;color:var(--tm)">暂无</td></tr>{% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
