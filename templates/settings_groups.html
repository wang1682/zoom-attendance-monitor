{% extends "base.html" %}
{% block title %}分组管理{% endblock %}
{% block head %}
<style>
.ipt{background:var(--bg);border:1px solid var(--cb);border-radius:6px;padding:7px 10px;font-size:13px;color:var(--text);outline:none;transition:border-color .15s;width:100%;box-sizing:border-box}
.ipt:focus{border-color:var(--pr)}
.bt{padding:6px 16px;border-radius:6px;font-size:12px;border:1px solid var(--cb);cursor:pointer;transition:all .12s;background:var(--card);color:var(--text)}
.bt:hover{background:var(--rh)}
.bt-s{padding:5px 12px;font-size:11px}
.bt-d{border-color:var(--da);color:var(--da)}
</style>
{% endblock %}
{% block content %}
<div class="page-container">
<div class="page-header"><h1 class="page-title">📂 分组管理</h1><p class="page-subtitle">管理成员分组名称（成员归属在 成员别名 页面配置）</p></div>

<div style="display:flex;gap:12px;margin-bottom:16px">
  <input id="newGroupName" class="ipt" placeholder="分组名称" style="width:200px">
  <input id="newGroupDesc" class="ipt" placeholder="描述" style="width:300px">
  <button class="bt" onclick="createGroup()">创建</button>
</div>

<div id="groupList" class="card" style="padding:16px">
  <table class="data-table" style="width:100%">
    <thead><tr><th>名称</th><th>描述</th><th>成员数</th><th>操作</th></tr></thead>
    <tbody id="groupTableBody"></tbody>
  </table>
</div>
</div>

<script>
async function loadGroups() {
  const r = await fetch('/api/v3/member-groups');
  const j = await r.json();
  const tb = document.getElementById('groupTableBody');
  if (!j.ok || !j.groups) { tb.innerHTML = '<tr><td colspan="4" class="td-empty">暂无分组</td></tr>'; return; }
  tb.innerHTML = j.groups.map(g => `<tr>
    <td class="td-name">${esc(g.name)}</td>
    <td style="color:var(--ts)">${esc(g.description || '—')}</td>
    <td>${g.members ? g.members.length : 0}</td>
    <td><button class="bt bt-s bt-d" onclick="deleteGroup(${g.id},'${esc(g.name)}')">删除</button></td>
  </tr>`).join('');
}
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;').replace(/"/g,'&quot;'); }
async function createGroup() {
  const name = document.getElementById('newGroupName').value.trim();
  const desc = document.getElementById('newGroupDesc').value.trim();
  if (!name) return alert('请输入分组名称');
  const r = await fetch('/api/v3/member-groups', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name, description: desc})});
  const j = await r.json();
  if (j.ok) { document.getElementById('newGroupName').value = ''; document.getElementById('newGroupDesc').value = ''; loadGroups(); }
  else alert('创建失败');
}
async function deleteGroup(id, name) {
  if (!confirm('确定删除分组 "' + name + '"？')) return;
  const r = await fetch('/api/v3/member-groups/' + id, {method:'DELETE'});
  const j = await r.json();
  if (j.ok) loadGroups();
  else alert('删除失败');
}
loadGroups();
</script>
{% endblock %}
