<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>告警 - Zoom 监控</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f172a;color:#e2e8f0}nav{background:#1e293b;padding:12px 24px;display:flex;gap:16px;align-items:center;border-bottom:1px solid #334155}nav a{color:#94a3b8;text-decoration:none;font-size:14px;padding:6px 12px;border-radius:6px}nav a:hover{background:#334155;color:#e2e8f0}nav .title{font-size:16px;font-weight:600;color:#f1f5f9;margin-right:auto}.container{max-width:1200px;margin:0 auto;padding:24px}.table-wrap{background:#1e293b;border-radius:8px;border:1px solid #334155;overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;padding:10px 12px;background:#0f172a;color:#94a3b8;font-weight:500}td{padding:8px 12px;border-top:1px solid #1e293b}tr:hover{background:#334155}.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}.badge-warning{background:#b91c1c;color:#fca5a5}.badge-info{background:#1e40af;color:#93c5fd}.badge-success{background:#065f46;color:#6ee7b7}.time{color:#94a3b8;font-family:monospace;font-size:12px}
</style>
</head>
<body>
<nav>
  <span class="title">👁️ Zoom 监控</span>
  <a href="/">仪表盘</a>
  <a href="/events">事件</a>
  <a href="/participants">参会</a>
  <a href="/alerts" style="background:#334155;color:#e2e8f0">告警</a>
</nav>
<div class="container">
  <h2 style="margin-bottom:12px;font-size:16px">🔔 告警日志</h2>
  <div class="table-wrap">
    <table>
      <thead><tr><th>ID</th><th>类型</th><th>严重度</th><th>标题</th><th>消息</th><th>时间</th></tr></thead>
      <tbody>
        {% for a in alerts %}
        <tr>
          <td>{{ a.id }}</td>
          <td>{{ a.alert_type }}</td>
          <td><span class="badge badge-{{ a.severity }}">{{ a.severity }}</span></td>
          <td>{{ a.title }}</td>
          <td style="color:#94a3b8;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ a.message }}</td>
          <td class="time">{{ a.created_at }}</td>
        </tr>
        {% endfor %}
        {% if not alerts %}
        <tr><td colspan="6" style="text-align:center;color:#64748b;padding:40px">暂无告警</td></tr>
        {% endif %}
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
