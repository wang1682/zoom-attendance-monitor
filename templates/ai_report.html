{% extends "base.html" %}
{% block title %}AI {{ period_name }}{% endblock %}
{% block content %}
<div class="page-container">
  <div class="page-header"><h1>🤖 AI {{ period_name }}</h1><p>自动生成参会分析报告</p>
    <button class="bt bt-p bt-s" onclick="genRep()" id="genBtn">📄 生成报告</button>
  </div>
  <div class="kpi-grid" id="aiStats" style="display:none;grid-template-columns:repeat(3,1fr)">
    <div class="kpi"><div class="t"><div class="n" id="aiPeople">—</div></div><div class="l">参会人数</div></div>
    <div class="kpi"><div class="t"><div class="n" id="aiEntries">—</div></div><div class="l">进入次数</div></div>
    <div class="kpi"><div class="t"><div class="n" style="font-size:16px" id="aiPeriod">{{ period_name }}</div></div><div class="l">周期</div></div>
  </div>
  <div class="card cp"><div id="aiContent" style="font-size:13px;line-height:1.7;color:var(--ts)">点击生成</div></div>
</div>
<script>
async function genRep(){const b=document.getElementById("genBtn");const e=document.getElementById("aiContent");b.disabled=true;b.textContent="⏳";e.textContent="生成中...";
const r=await fetch("/api/ai-report?period={{ period }}");const d=await r.json();
if(d.ok){document.getElementById("aiStats").style.display="grid";document.getElementById("aiPeople").textContent=d.total_people;document.getElementById("aiEntries").textContent=d.total_entries;e.innerHTML=d.report.replace(/\n/g,"<br>")}else{e.innerHTML=d.note||"生成失败"}
b.disabled=false;b.textContent="🔄 重新生成"}
genRep();
</script>
{% endblock %}
