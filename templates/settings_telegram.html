{% extends "base.html" %}
{% block title %}Telegram 配置{% endblock %}
{% block content %}
<div class="page-container">
  <div class="page-header"><h1>📤 Telegram 配置</h1><p>Bot 推送配置</p></div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px">
    <div class="card cp"><h2 style="font-size:14px;font-weight:600;margin-bottom:12px">🤖 Bot 状态</h2>
      <table class="data-table"><tbody>
        <tr><td style="color:var(--ts)">状态</td><td><span class="bg {{ 'bg-g' if bot_ok else 'bg-r' }}">{{ "🟢 在线" if bot_ok else "🔴 离线" }}</span></td></tr>
        <tr><td style="color:var(--ts)">用户名</td><td>{% if bot_ok %}@{{ bot_username }}{% else %}—{% endif %}</td></tr>
        <tr><td style="color:var(--ts)">通知 Chat ID</td><td class="mono">{{ home_chat_id }}</td></tr>
      </tbody></table>
    </div>
    <div class="card cp"><h2 style="font-size:14px;font-weight:600;margin-bottom:12px">🧪 测试推送</h2>
      <button class="bt bt-p bt-s" onclick="testPush()" id="testBtn">📨 发送测试消息</button>
      <div id="testResult" style="margin-top:8px;font-size:12px"></div>
    </div>
  </div>
</div>
<script>
async function testPush(){const b=document.getElementById("testBtn");const r=document.getElementById("testResult");b.disabled=true;b.textContent="⏳";
try{const j=await(await fetch("/api/tg/send-test",{method:"POST"})).json();r.innerHTML=j.ok?'<span style="color:var(--sc)">✅ 已发送</span>':'<span style="color:var(--da)">❌ 失败</span>'}catch(e){r.innerHTML='<span style="color:var(--da)">❌ 请求失败</span>'}
b.disabled=false;b.textContent="📨 发送测试消息"}
</script>
{% endblock %}
