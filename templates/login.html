<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 — Zoom Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc', 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 800: '#3730a3', 900: '#312e81' },
                        surface: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 800: '#1e293b', 850: '#172033', 900: '#0f172a', 950: '#020617' },
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .card { @apply bg-white dark:bg-surface-800 rounded-xl shadow-sm border border-gray-100 dark:border-surface-700; }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-white dark:from-surface-900 dark:to-surface-950 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <div class="w-14 h-14 rounded-xl bg-gradient-to-br from-primary-500 to-primary-700 flex items-center justify-center text-white font-bold text-xl mx-auto mb-4">ZM</div>
            <h1 class="text-xl font-bold text-gray-900 dark:text-white">Zoom Monitor</h1>
            <p class="text-sm text-gray-400 dark:text-gray-500 mt-1">Phase 3 Dashboard</p>
        </div>

        <div class="card p-6">
            <form method="POST" action="/login">
                {% if error %}
                <div class="mb-4 px-3 py-2 rounded-lg bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 text-sm text-red-700 dark:text-red-300">
                    {{ error }}
                </div>
                {% endif %}
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">用户名</label>
                    <input type="text" name="username" required
                           class="w-full px-3 py-2.5 text-sm bg-gray-50 dark:bg-surface-900 border border-gray-200 dark:border-surface-700 rounded-lg text-gray-900 dark:text-gray-100 placeholder-gray-400 focus:border-primary-500 focus:ring-1 focus:ring-primary-500 outline-none transition-colors"
                           placeholder="输入管理员账号">
                </div>
                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">密码</label>
                    <input type="password" name="password" required
                           class="w-full px-3 py-2.5 text-sm bg-gray-50 dark:bg-surface-900 border border-gray-200 dark:border-surface-700 rounded-lg text-gray-900 dark:text-gray-100 placeholder-gray-400 focus:border-primary-500 focus:ring-1 focus:ring-primary-500 outline-none transition-colors"
                           placeholder="输入密码">
                </div>
                <button type="submit"
                        class="w-full py-2.5 text-sm font-medium text-white bg-gradient-to-r from-primary-500 to-primary-700 rounded-lg hover:from-primary-600 hover:to-primary-800 transition-all shadow-sm">
                    登录
                </button>
            </form>
        </div>

        <p class="text-center text-xs text-gray-400 dark:text-gray-500 mt-6">v0.2.0 · Zoom Monitor Dashboard</p>
    </div>
</body>
</html>
