{% extends "base.html" %}
{% block title %}Zoom 配置{% endblock %}
{% block content %}
<div class="page-container">
  <div class="page-header"><h1>🎥 Zoom 配置</h1><p>监控系统配置状态</p></div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px">
    <div class="card cp"><h2 style="font-size:14px;font-weight:600;margin-bottom:12px">🔑 API 凭证</h2>
      <table class="data-table"><tbody>
        <tr><td style="color:var(--ts)">主持人</td><td>{{ host_email or "未配置" }}</td></tr>
        <tr><td style="color:var(--ts)">PMI</td><td class="mono">{{ pmi_id or "未配置" }}</td></tr>
        <tr><td style="color:var(--ts)">轮询间隔</td><td>{{ monitor_interval }}秒</td></tr>
        <tr><td style="color:var(--ts)">Webhook</td><td><span class="bg {{ 'bg-g' if webhook_status=='运行中' else 'bg-r' }}">{{ webhook_status }}</span></td></tr>
      </tbody></table>
    </div>
    <div class="card cp">
      <h2 style="font-size:14px;font-weight:600;margin-bottom:12px">🔗 当前账号</h2>
      <div style="text-align:center;padding:24px;color:var(--tm);font-size:13px">
        <div style="font-size:40px;margin-bottom:8px">✅</div>
        <div style="font-weight:500;color:var(--text)">marieonn27@gmail.com</div>
        <div style="margin-top:4px">超级管理员</div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
