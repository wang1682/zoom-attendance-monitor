<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Zoom Monitor{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc', 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 800: '#3730a3', 900: '#312e81' },
                        surface: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 800: '#1e293b', 850: '#172033', 900: '#0f172a', 950: '#020617' },
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .card { @apply bg-white dark:bg-surface-800 rounded-xl shadow-sm border border-gray-100 dark:border-surface-700; }
        .card-hover { @apply card transition-all hover:shadow-md hover:border-primary-300 dark:hover:border-primary-600; }
        .stat-value { @apply text-3xl font-bold text-gray-900 dark:text-white; }
        .stat-label { @apply text-sm font-medium text-gray-500 dark:text-gray-400; }
        .badge { @apply inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium; }
        .badge-green { @apply badge bg-emerald-100 text-emerald-800 dark:bg-emerald-900/40 dark:text-emerald-300; }
        .badge-red { @apply badge bg-red-100 text-red-800 dark:bg-red-900/40 dark:text-red-300; }
        .badge-yellow { @apply badge bg-amber-100 text-amber-800 dark:bg-amber-900/40 dark:text-amber-300; }
        .badge-blue { @apply badge bg-blue-100 text-blue-800 dark:bg-blue-900/40 dark:text-blue-300; }
        .badge-gray { @apply badge bg-gray-100 text-gray-700 dark:bg-gray-700 dark:text-gray-300; }
        .table-header { @apply px-4 py-3 text-left text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider; }
        .table-cell { @apply px-4 py-3 text-sm text-gray-700 dark:text-gray-300; }
        tr.hover-row:hover { @apply bg-gray-50 dark:bg-surface-850/50; }
        .sidebar-link { @apply flex items-center gap-3 px-4 py-2.5 text-sm rounded-lg transition-colors; }
        .sidebar-link-active { @apply sidebar-link bg-primary-50 dark:bg-primary-900/20 text-primary-700 dark:text-primary-300 font-medium; }
        .sidebar-link-inactive { @apply sidebar-link text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-surface-850 hover:text-gray-900 dark:hover:text-white; }
        .section-label { @apply px-4 py-2 text-xs font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wider; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 3px; }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="bg-gradient-to-br from-blue-50 to-white dark:from-surface-900 dark:to-surface-950 min-h-screen text-gray-900 dark:text-gray-100">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-white/80 dark:bg-surface-900/80 backdrop-blur-lg border-r border-gray-200 dark:border-surface-700 flex flex-col shrink-0 overflow-y-auto">
            <div class="p-5 border-b border-gray-100 dark:border-surface-700">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-primary-500 to-primary-700 flex items-center justify-center text-white font-bold text-sm">ZM</div>
                    <div>
                        <div class="text-sm font-semibold text-gray-900 dark:text-white">Zoom Monitor</div>
                        <div class="text-xs text-gray-400 dark:text-gray-500">v0.2.0</div>
                    </div>
                </div>
            </div>
            <nav class="p-3 space-y-1 flex-1">
                {% for section in nav_items or [] %}
                <div class="pt-{{ '0' if loop.first else '3' }}">
                    <div class="section-label">{{ section.label }}</div>
                    {% for item in section.items %}
                    <a href="{{ item.url }}" class="{% if item.active %}sidebar-link-active{% else %}sidebar-link-inactive{% endif %}">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="{{ item.icon }}"/>
                        </svg>
                        {{ item.title }}
                    </a>
                    {% endfor %}
                </div>
                {% endfor %}
            </nav>
            <div class="p-3 border-t border-gray-100 dark:border-surface-700 space-y-1">
                <a href="/api/v2/health" target="_blank" class="sidebar-link-inactive text-xs">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/></svg>
                    API 状态
                </a>
                <a href="/logout" class="sidebar-link-inactive text-xs">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                    登出
                </a>
            </div>
        </aside>

        <!-- Main -->
        <main class="flex-1 overflow-y-auto p-6 lg:p-8">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
