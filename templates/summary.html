<!-- TEMPLATE: summary.html v082-polish -->
{% extends "base.html" %}
{% block title %}汇总分析{% endblock %}
{% block content %}
<div class="page-container">
<div class="page-header"><h1 class="page-title">汇总分析</h1><p class="page-subtitle">今日参会数据与 AI 洞察</p></div>

<div class="metric-grid mg-5" id="sumStats">
  <div class="metric-card">
    <div class="mc-icon" style="background:var(--in-b);color:var(--in)">👥</div>
    <div class="mc-value" id="sTotal">—</div>
    <div class="mc-label">参与人数</div>
    <div class="mc-sub">今日活跃成员</div>
  </div>
  <div class="metric-card">
    <div class="mc-icon" style="background:var(--sc-b);color:var(--sc)">📋</div>
    <div class="mc-value" id="sRecords">—</div>
    <div class="mc-label">出勤记录</div>
    <div class="mc-sub">已记录事件</div>
  </div>
  <div class="metric-card">
    <div class="mc-icon" style="background:var(--pr);color:#fff">⏱</div>
    <div class="mc-value" id="sAvg">—</div>
    <div class="mc-label">平均时长</div>
    <div class="mc-sub">人均在线</div>
  </div>
  <div class="metric-card">
    <div class="mc-icon" style="background:var(--wa-b);color:var(--wa)">⚠</div>
    <div class="mc-value" style="color:var(--wa)" id="sLate">—</div>
    <div class="mc-label">迟到</div>
    <div class="mc-sub">风险成员</div>
  </div>
  <div class="metric-card">
    <div class="mc-icon" style="background:var(--da-b);color:var(--da)">🚨</div>
    <div class="mc-value" style="color:var(--da)" id="sEarly">—</div>
    <div class="mc-label">早退</div>
    <div class="mc-sub">需关注</div>
  </div>
</div>

<div class="insight-grid" id="insightArea">
  <div class="insight-card" id="topOnlineCard">
    <div class="insight-header">🏆 今日最长在线</div>
    <div id="topOnlineContent"><div class="insight-empty">加载中...</div></div>
  </div>
  <div class="insight-card" id="riskMembersCard">
    <div class="insight-header">⚠ 风险成员</div>
    <div id="riskMembersContent"><div class="insight-empty">加载中...</div></div>
  </div>
  <div class="insight-card" id="aiSummaryCard">
    <div class="insight-header">🤖 AI 总结</div>
    <div id="aiSummaryContent"><div class="insight-empty">加载中...</div></div>
  </div>
</div>

<div class="card">
  <div class="card-header"><h2>参会明细</h2></div>
  <table class="data-table"><thead><tr><th>姓名</th><th>会议室</th><th>进入</th><th>离开</th><th>时长</th><th>状态</th></tr></thead><tbody id="memberTable"><tr><td colspan="6" class="td-empty">加载中...</td></tr></tbody></table>
</div>

<div class="card" style="margin-top:16px">
  <div class="card-header"><h2>AI 出勤分析</h2></div>
  <button class="btn btn-primary btn-sm" onclick="runAI()" id="aiBtn" style="margin:16px 18px">生成报告</button>
  <div id="aiReport" style="padding:0 18px 18px;font-size:13px;line-height:1.7;color:var(--ts)"></div>
</div>
</div>

<script>
async function loadSum(){
  const r=await fetch("/api/v2/summary");
  const d=await r.json();
  if(!d.ok)return;
  document.getElementById("sTotal").textContent=d.stats.total_participants;
  document.getElementById("sRecords").textContent=d.stats.total_records;
  document.getElementById("sAvg").textContent=d.stats.avg_duration_min+"分";
  document.getElementById("sLate").textContent=d.stats.late_count;
  document.getElementById("sEarly").textContent=d.stats.early_leave_count;

  // Top online
  const tc=document.getElementById("topOnlineContent");
  const sorted=[...d.members].sort((a,b)=>b.duration_min-a.duration_min);
  const top=sorted[0];
  if(top){
    tc.innerHTML=`<div class="insight-item"><span class="insight-name">${top.name}</span><span class="insight-meta">${top.duration_min}分钟</span></div>`;
  } else {
    tc.innerHTML='<div class="insight-empty">暂无数据</div>';
  }

  // Risk members
  const rc=document.getElementById("riskMembersContent");
  const risks=d.members.filter(m=>m.is_late||m.is_early_leave);
  if(risks.length){
    rc.innerHTML=risks.slice(0,5).map(m=>{
      const tag=m.is_early_leave?'早退':'迟到';
      return `<div class="insight-item"><span class="insight-name">${m.name}</span><span class="insight-meta" style="color:var(--wa)">${tag}</span></div>`;
    }).join("");
  } else {
    rc.innerHTML='<div class="insight-empty">✅ 今日无风险成员</div>';
  }

  // AI summary (reuse from dashboard or inline)
  const ac=document.getElementById("aiSummaryContent");
  try {
    const ar=await fetch("/api/v2/live");
    const ad=await ar.json();
    if(ad.ok&&ad.ai_summary){
      const lines=ad.ai_summary.split("。").filter(Boolean).slice(0,3);
      ac.innerHTML=lines.map(s=>`<div class="insight-item"><span style="font-size:12px;color:var(--ts)">${s}。</span></div>`).join("");
    } else {
      ac.innerHTML='<div class="insight-empty">数据不足</div>';
    }
  } catch(e){
    ac.innerHTML='<div class="insight-empty">AI 不可用</div>';
  }

  // Members table
  const t=document.getElementById("memberTable");
  if(d.members.length){
    t.innerHTML=d.members.map(m=>{
      let b=m.is_late?'<span class="badge badge-yellow">迟到</span>':m.is_early_leave?'<span class="badge badge-yellow">早退</span>':'<span class="badge badge-green">正常</span>';
      return `<tr><td class="td-name">${m.name}</td><td>${m.meeting_id}</td><td class="td-mono">${(m.enter_time||"").slice(11,19)||"—"}</td><td class="td-mono">${(m.leave_time||"").slice(11,19)||"—"}</td><td>${m.duration_min}分钟</td><td>${b}</td></tr>`;
    }).join("");
  } else {
    t.innerHTML='<tr><td colspan="6" class="td-empty">暂无</td></tr>';
  }
}
async function runAI(){
  const b=document.getElementById("aiBtn");
  const e=document.getElementById("aiReport");
  b.disabled=true;b.textContent="...";
  e.textContent="分析中...";
  const r=await fetch("/api/v2/ai-analysis");
  const d=await r.json();
  e.innerHTML=d.ok&&d.report?d.report.replace(/\n/g,"<br>"):"AI 不可用";
  b.disabled=false;b.textContent="重新生成";
}
loadSum();
</script>
{% endblock %}
