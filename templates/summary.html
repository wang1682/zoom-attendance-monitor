{% extends "base.html" %}
{% block title %}汇总分析{% endblock %}
{% block content %}
<div class="page-container">
<div class="page-header"><h1 class="page-title">&#128202; 汇总分析</h1><p class="page-subtitle">参会数据汇总与 AI 出勤分析</p></div>
<div class="kpi-grid" style="grid-template-columns:repeat(5,1fr);margin-bottom:20px" id="sumStats">
<div class="kpi-card"><div class="kpi-top"><span class="kpi-value" id="sTotal">&#8212;</span></div><div class="kpi-label">参与人数</div></div>
<div class="kpi-card"><div class="kpi-top"><span class="kpi-value" id="sRecords">&#8212;</span></div><div class="kpi-label">记录数</div></div>
<div class="kpi-card"><div class="kpi-top"><span class="kpi-value" id="sAvg">&#8212;</span></div><div class="kpi-label">平均时长</div></div>
<div class="kpi-card"><div class="kpi-top"><span class="kpi-value" id="sLate" style="color:var(--wa)">&#8212;</span></div><div class="kpi-label">迟到</div></div>
<div class="kpi-card"><div class="kpi-top"><span class="kpi-value" id="sEarly" style="color:var(--da)">&#8212;</span></div><div class="kpi-label">早退</div></div>
</div>
<div class="card" style="margin-bottom:16px"><table class="data-table"><thead><tr><th>姓名</th><th>会议室</th><th>进入</th><th>离开</th><th>时长</th><th>状态</th></tr></thead><tbody id="memberTable"></tbody></table></div>
<div class="card"><div class="card-header"><h2>&#129302; AI 出勤分析</h2></div>
<button class="btn btn-primary btn-sm" onclick="runAI()" id="aiBtn" style="margin:16px 18px">生成报告</button>
<div id="aiReport" style="padding:0 18px 18px;font-size:13px;line-height:1.7;color:var(--ts)"></div></div>
</div>
<script>
async function loadSum(){const r=await fetch("/api/v2/summary");const d=await r.json();if(!d.ok)return;
document.getElementById("sTotal").textContent=d.stats.total_participants;document.getElementById("sRecords").textContent=d.stats.total_records;
document.getElementById("sAvg").textContent=d.stats.avg_duration_min+"分";document.getElementById("sLate").textContent=d.stats.late_count;document.getElementById("sEarly").textContent=d.stats.early_leave_count;
const t=document.getElementById("memberTable");
if(d.members.length){t.innerHTML=d.members.map(m=>{let b=m.is_late?'<span class="badge badge-yellow">&#36831;&#21040;</span>':m.is_early_leave?'<span class="badge badge-yellow">&#26089;&#36864;</span>':'<span class="badge badge-green">&#27491;&#24120;</span>';return`<tr><td class="td-name">${m.name}</td><td>${m.meeting_id}</td><td class="td-mono">${(m.enter_time||"").slice(11,19)||"—"}</td><td class="td-mono">${(m.leave_time||"").slice(11,19)||"—"}</td><td>${m.duration_min}&#20998;&#38047;</td><td>${b}</td></tr>`}).join("")}else{t.innerHTML='<tr><td colspan="6" class="td-empty">&#26242;&#26080;</td></tr>'}}
async function runAI(){const b=document.getElementById("aiBtn");const e=document.getElementById("aiReport");b.disabled=true;b.textContent="&#9203;";e.textContent="&#20998;&#26512;&#20013;..."
const r=await fetch("/api/v2/ai-analysis");const d=await r.json();e.innerHTML=d.ok&&d.report?d.report.replace(/\n/g,"<br>"):"AI &#19981;&#21487;&#29992;";b.disabled=false;b.textContent="&#8635; &#37325;&#26032;&#29983;&#25104;"}
loadSum();
</script>
{% endblock %}
