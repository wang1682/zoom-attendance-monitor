<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选择租户 — Zoom Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc', 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 800: '#3730a3', 900: '#312e81' },
                        surface: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 800: '#1e293b', 850: '#172033', 900: '#0f172a', 950: '#020617' },
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .card { @apply bg-white dark:bg-surface-800 rounded-xl shadow-sm border border-gray-100 dark:border-surface-700; }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-white dark:from-surface-900 dark:to-surface-950 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <div class="w-14 h-14 rounded-xl bg-gradient-to-br from-primary-500 to-primary-700 flex items-center justify-center text-white font-bold text-xl mx-auto mb-4">ZM</div>
            <h1 class="text-xl font-bold text-gray-900 dark:text-white">选择租户</h1>
            <p class="text-sm text-gray-400 dark:text-gray-500 mt-1">你有多个可访问的租户</p>
        </div>

        <div class="card p-6 space-y-3">
            {% for t in tenants %}
            <form method="POST" action="/select-tenant">
                <input type="hidden" name="tenant_id" value="{{ t.tenant_id }}">
                <button type="submit"
                        class="w-full text-left px-4 py-3 rounded-lg bg-gray-50 dark:bg-surface-900 border border-gray-200 dark:border-surface-700 hover:border-primary-500 dark:hover:border-primary-500 transition-colors cursor-pointer">
                    <div class="font-medium text-gray-900 dark:text-gray-100">{{ t.display_name or t.name }}</div>
                    <div class="text-xs text-gray-400 dark:text-gray-500 mt-0.5">{{ t.plan or '未检测' }} · {{ t.tenant_id }}</div>
                </button>
            </form>
            {% endfor %}
            <form method="POST" action="/logout" class="pt-3">
                <button type="submit" class="w-full py-2 text-sm text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition-colors">
                    返回登录
                </button>
            </form>
        </div>

        <p class="text-center text-xs text-gray-400 dark:text-gray-500 mt-6">Zoom Monitor Dashboard</p>
    </div>
</body>
</html>
