{% extends "base.html" %}
{% block title %}实时在线{% endblock %}
{% block content %}
<div class="page-container">
  <div class="page-header"><h1>🟢 实时在线</h1><p>当前在线参会者</p></div>
  <div class="kpi-grid" style="grid-template-columns:repeat(2,1fr)">
    <div class="kpi"><div class="t"><div class="ic" style="background:var(--sc-b);color:var(--sc)">🟢</div><div class="n" id="liveTotal">—</div></div><div class="l">在线人数</div></div>
    <div class="kpi"><div class="t"><div class="ic" style="background:var(--in-b);color:var(--in)">🏢</div><div class="n" id="liveMeetings">—</div></div><div class="l">活跃会议室</div></div>
  </div>
  <div class="card cp"><h2 style="font-size:14px;font-weight:600;margin-bottom:12px">👤 当前在线</h2>
    <table class="data-table"><thead><tr><th>姓名</th><th>会议室</th><th>进入时间</th><th>在线时长</th></tr></thead><tbody id="liveTable"></tbody></table>
  </div>
  <div class="card cp" style="margin-top:16px"><h2 style="font-size:14px;font-weight:600;margin-bottom:12px">🏢 活跃会议室</h2>
    <table class="data-table"><thead><tr><th>会议 ID</th><th>在线人数</th><th>已进行</th><th>最早进入</th></tr></thead><tbody id="meetingLiveTable"></tbody></table>
  </div>
</div>
<script>
async function loadLive(){const r=await fetch("/api/v2/live");const d=await r.json();if(!d.ok)return;
document.getElementById("liveTotal").textContent=d.total_online;
document.getElementById("liveMeetings").textContent=Object.keys(d.meetings||{}).length;
document.getElementById("liveTable").innerHTML=d.online.length?d.online.map(m=>`<tr><td class="nm">${m.name}</td><td class="mono">${m.meeting_id}</td><td>${to_myt(m.enter_time)}</td><td><span class="bg bg-g">${m.online_display||m.online_minutes+"分钟"}</span></td></tr>`).join(""):'<tr><td colspan="4" style="text-align:center;padding:32px;color:var(--tm)">暂无</td></tr>';
const ms=Object.values(d.meetings||{});
document.getElementById("meetingLiveTable").innerHTML=ms.length?ms.map(m=>`<tr><td class="mono">${Object.keys(d.meetings).find(k=>d.meetings[k]===m)}</td><td>${m.participant_count}</td><td>${m.elapsed_minutes}分钟</td><td>${to_myt(m.earliest_enter)}</td></tr>`).join(""):'<tr><td colspan="4" style="text-align:center;padding:32px;color:var(--tm)">暂无</td></tr>';}
loadLive();setInterval(loadLive,30000);
</script>
{% endblock %}
