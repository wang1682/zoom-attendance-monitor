{% extends "base.html" %}
{% block title %}实时在线{% endblock %}
{% block content %}
<div class="page-container">
  <div class="page-header">
    <h1 class="page-title">🟢 实时在线</h1>
    <p class="page-subtitle">当前在线参会者</p>
  </div>

  <div class="kpi-grid two">
    <div class="kpi-card">
      <div class="kpi-label">在线人数</div>
      <div class="kpi-value" id="liveTotal">—</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">活跃会议室</div>
      <div class="kpi-value" id="liveMeetings">—</div>
    </div>
  </div>

  <div class="grid-2">
    <section class="card">
      <div class="card-header">
        <h2 class="card-title">当前在线</h2>
      </div>
      <table class="data-table">
        <thead>
          <tr><th>姓名</th><th>会议室</th><th>进入时间</th><th>在线时长</th></tr>
        </thead>
        <tbody id="liveTable">
          <tr><td colspan="4" class="td-empty">加载中...</td></tr>
        </tbody>
      </table>
    </section>

    <section class="card">
      <div class="card-header">
        <h2 class="card-title">活跃会议室</h2>
      </div>
      <table class="data-table">
        <thead>
          <tr><th>会议 ID</th><th>在线人数</th><th>已进行</th><th>最早进入</th></tr>
        </thead>
        <tbody id="meetingLiveTable">
          <tr><td colspan="4" class="td-empty">加载中...</td></tr>
        </tbody>
      </table>
    </section>
  </div>
</div>
<script>
async function loadLive(){
  try{
    const r=await fetch("/api/v3/live");
    const j=await r.json();
    const d=j.data||j||{};
    if(!d.total_online&&d.total_online!==0) throw new Error("API returned no data");

    const online = d.online_list || [];
    if(!online.length && d.meetings && d.meetings.length) {
      var fl=[];
      d.meetings.forEach(function(m){(m.participants||[]).forEach(function(p){fl.push(p)});});
      fl.forEach(function(p){if(p.is_online!==false)online.push(p);});
    }
    const meetings=d.meetings||[];
    const totalOnline=d.total_online||online.length;

    document.getElementById("liveTotal").textContent=totalOnline;
    document.getElementById("liveMeetings").textContent=meetings.length;

    // Online table
    const lt=document.getElementById("liveTable");
    if(online.length){
      lt.innerHTML=online.map(p=>{
        const name=p.name||p.display_name||p.user_name||"—";
        const room=p.room||p.meeting_topic||p.meeting_id||"—";
        // join_time_display is already MYT, display directly
        const jt = to_myt(p.join_time) || p.join_time_display || p.last_active_myt || "—";
        const dur=p.duration_display||p.duration_text||p.duration||p.online_duration||(p.online_display||"");
        return `<tr><td class="td-name">${name}</td><td class="td-mono">${room}</td><td>${jt}</td><td><span class="badge badge-green">${dur}</span></td></tr>`;
      }).join("");
    } else {
      lt.innerHTML='<tr><td colspan="4" class="td-empty">暂无在线</td></tr>';
    }

    // Meetings table
    const mt=document.getElementById("meetingLiveTable");
    if(meetings.length){
      mt.innerHTML=meetings.map(m=>{
        const mid=m.meeting_id||m.id||"—";
        const oc=m.online_count||m.raw_online_count||(m.participants?m.participants.length:0)||0;
        const dur=m.elapsed_minutes?m.elapsed_minutes+"分钟":(m.duration||m.duration_text||"—");
        const ej=m.earliest_join_display||m.earliest_join||m.start_time||"—";
        return `<tr><td class="td-mono">${m.topic||mid}</td><td>${oc}</td><td>${dur}</td><td>${to_myt(ej)}</td></tr>`;
      }).join("");
    } else {
      mt.innerHTML='<tr><td colspan="4" class="td-empty">暂无活跃会议室</td></tr>';
    }
  } catch(e) {
    document.getElementById("liveTable").innerHTML='<tr><td colspan="4" class="td-empty">加载失败: '+e.message+'</td></tr>';
    document.getElementById("meetingLiveTable").innerHTML='<tr><td colspan="4" class="td-empty">加载失败: '+e.message+'</td></tr>';
  }
}
loadLive();
setInterval(loadLive,30000);
</script>
{% endblock %}
